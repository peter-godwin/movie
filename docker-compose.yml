services:
  api:
    build: .
    container_name: moviz_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://moviz:moviz@db:5432/movizdb
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: moviz_db
    environment:
      POSTGRES_USER: moviz
      POSTGRES_PASSWORD: moviz
      POSTGRES_DB: movizdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moviz -d movizdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
